name: Test and publish the website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    # macOS has jsc (JavaScriptCore), which tests/run.sh uses to check the WebAssembly path the website and repl run (Linux uses node and native/jsc-on-node.js)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: tests/run.sh (needs only clang)
        run: tests/run.sh
  site-check:
    # the quick, compiler-free checks of the website itself; the deploy depends on this, not on the full suite above
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh site/check.sh
  deploy:
    if: github.event_name != 'pull_request'
    needs: site-check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (copies the docs in; latest.json is committed with each release)
        run: sh site/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
