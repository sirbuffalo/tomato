name: Publish the website
# Deploys tomato.davismcd.com after each push to main. Deliberately independent of the macOS test suite (tests.yml), so a slow or red
# test run can neither delay nor cancel a deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # never cancel: cancelling a run mid-deploy leaves the Pages deployment half-made; a newer push just queues behind the running one
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Quick, compiler-free checks of the website
        run: sh site/check.sh
      - name: Assemble the site (copies the docs in; latest.json is committed with each release)
        run: sh site/build.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # site/.nojekyll is a dotfile; upload-pages-artifact v4+ leaves dotfiles out unless asked
          include-hidden-files: true
  deploy:
    # a separate job from the upload: deploy-pages looks the artifact up by name through the Actions API, which can briefly lag behind
    # the upload (it failed with 'No artifacts named "github-pages" were found' ~1s after a successful upload)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Retry once if the artifact lookup lagged behind the upload
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
