name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # macOS has jsc (JavaScriptCore), which tests/run.sh uses to check the WebAssembly path the website and repl run (Linux uses node and native/jsc-on-node.js)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # the wasm checks run each program with a 5 s limit by default; a hosted runner can be much slower than a Mac
      # (tests/run.sh passes this to jsc as an argument, because jsc has no environment)
      TOMATO_WASM_TIMEOUT_MS: "30000"
    steps:
      - uses: actions/checkout@v6
      - name: Versions
        run: clang --version | head -1 && sw_vers -productVersion && sysctl -n hw.ncpu && (go version; rustc --version; cargo --version; python3 --version) 2>&1 | head -4 || true
      - name: tests/run.sh (needs only clang)
        shell: bash   # with -o pipefail, so a failing run is a failing step even though its output is copied to a file
        run: tests/run.sh --times 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Show what failed (the job log is visible only to repository admins; annotations and the summary are visible to everyone)
        if: failure()
        run: tests/ci_report.sh "$RUNNER_TEMP/tests.log"
  site-check:
    # the quick, compiler-free checks of the website itself (the deploy workflow runs the same before publishing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sh site/check.sh
