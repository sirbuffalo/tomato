<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomato reference</title><meta name="description" content="The Tomato language specification, decision log, decision inventory, open questions and placeholders."><link rel="stylesheet" href="style.css">
<style>
.docs-layout { display:flex; gap:2rem; align-items:flex-start; }
.docs-nav { display:block; max-width:none; margin:0; padding:0; flex:0 0 15rem; font-size:.95rem; position:sticky; top:1rem; max-height:90vh; overflow:auto; }
.docs-nav h3 { margin:.9rem 0 .3rem; font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; opacity:.7; }
.docs-nav a { display:block; padding:.15rem 0; }
.docs-nav a.on { font-weight:bold; }
.docs-nav .sub { padding-left:.9rem; }
.docs-body { flex:1; min-width:0; }
@media (max-width:720px) { .docs-layout { flex-direction:column; align-items:stretch; gap:1rem; } .docs-nav { position:static; flex:none; max-height:none; } }
</style><link rel="icon" href="favicon.ico?v=3" sizes="48x48"><link rel="icon" href="favicon.svg?v=3" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=3"><link rel="manifest" href="site.webmanifest?v=3"></head>
<body><header id="site-header"></header><main class="doc">
<h1><img class="mark" src="assets/tomato-icon-square.svg" alt="" width="32" height="32">Reference</h1>
<p class="lead">Generated from the repository's documents, so it matches the code. Each document is split into sections; pick one from the list.</p>
<div class="docs-layout"><nav class="docs-nav" id="nav" aria-label="Reference sections"></nav><div id="content" class="doc docs-body">Loading…</div></div>
</main><script src="config.js"></script><script src="site.js"></script>
<script>
var DOCS = [
  ["specification", "Specification", "docs/specification.md"],
  ["decisions", "Decision log", "docs/decisions.md"],
  ["decision-inventory", "Decision inventory", "docs/decision-inventory.md"],
  ["open-questions", "Open questions", "docs/open-questions.md"],
  ["errors", "Error messages", "docs/errors.md"],
  ["provisional", "Placeholders (P1…)", "docs/PROVISIONAL.md"]
];
var cache = {};
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function load(key) {
  if (cache[key]) return Promise.resolve(cache[key]);
  var d = DOCS.filter(function (x) { return x[0] === key; })[0];
  return fetch(d[2]).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (t) {
    var secs = [{ id: "overview", title: "Overview", lines: [] }];
    var code = false;
    t.split("\n").forEach(function (l) {
      if (l.indexOf("```") === 0) code = !code;
      var m = !code && /^## (.*)$/.exec(l);
      if (m) secs.push({ id: slug(m[1]), title: m[1], lines: [l] }); else secs[secs.length - 1].lines.push(l);
    });
    secs = secs.filter(function (s) { return s.lines.join("").trim() !== ""; });
    return (cache[key] = secs);
  });
}
function route() {
  var parts = location.hash.replace(/^#/, "").split("/");
  var key = DOCS.some(function (d) { return d[0] === parts[0]; }) ? parts[0] : "specification";
  load(key).then(function (secs) {
    var sec = secs.filter(function (s) { return s.id === parts[1]; })[0] || secs[0];
    var nav = "";
    DOCS.forEach(function (d) {
      nav += '<h3><a href="#' + d[0] + '"' + (d[0] === key ? ' class="on"' : "") + ">" + d[1] + "</a></h3>";
      if (d[0] === key) secs.forEach(function (s) {
        nav += '<a class="sub' + (s === sec ? " on" : "") + '" href="#' + key + "/" + s.id + '">' + esc(s.title) + "</a>";
      });
    });
    document.getElementById("nav").innerHTML = nav;
    document.getElementById("content").innerHTML = markdown(sec.lines.join("\n"));
    var i = secs.indexOf(sec), foot = "<p>";
    if (i > 0) foot += '<a href="#' + key + "/" + secs[i - 1].id + '">← ' + esc(secs[i - 1].title) + "</a>  ";
    if (i < secs.length - 1) foot += '<a href="#' + key + "/" + secs[i + 1].id + '">' + esc(secs[i + 1].title) + " →</a>";
    document.getElementById("content").insertAdjacentHTML("beforeend", foot + "</p>");
    window.scrollTo(0, 0);
  }).catch(function () { document.getElementById("content").textContent = "This document is not published yet."; });
}
window.onhashchange = route; route();
</script></body></html>
